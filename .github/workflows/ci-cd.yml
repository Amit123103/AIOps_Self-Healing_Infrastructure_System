# === FILE: .github/workflows/ci-cd.yml ===
name: AIOps Perfect CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  REGISTRY: ghcr.io


jobs:
  lint-and-test:
    name: Code Quality & Testing
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8
          if [ -f microservice/requirements.txt ]; then pip install -r microservice/requirements.txt; fi
          if [ -f aiops_engine/requirements.txt ]; then pip install -r aiops_engine/requirements.txt; fi

      - name: Lint with Flake8
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings.
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Dry-Run AI Models
        run: |
          # Run the perfectly crafted training script to ensure models can generate cleanly
          python aiops_engine/train_models.py
          # Verify the models folder contains the output
          ls -la models/

  validate-kubernetes:
    name: Validate K8s Manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Setup Kubeconform
        run: |
          wget https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform-linux-amd64.tar.gz
          sudo mv kubeconform /usr/local/bin/

      - name: Validate YAML
        run: |
          kubeconform -strict -ignore-missing-schemas k8s/*.yaml

  build-and-push-docker:
    name: Build & Push to GHCR
    needs: [lint-and-test, validate-kubernetes]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Only push images on merges to main, not on PRs
    if: github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Lowercase image names
        run: |
          echo "IMAGE_NAME_MICROSERVICE=$(echo ${{ github.repository }}/microservice | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV
          echo "IMAGE_NAME_AIOPS=$(echo ${{ github.repository }}/aiops_engine | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV


      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Microservice
        uses: docker/build-push-action@v4
        with:
          context: ./microservice
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_MICROSERVICE }}:latest,${{ env.REGISTRY }}/${{ env.IMAGE_NAME_MICROSERVICE }}:${{ github.sha }}

      - name: Build and Push AIOps Engine
        uses: docker/build-push-action@v4
        with:
          context: ./aiops_engine
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_AIOPS }}:latest,${{ env.REGISTRY }}/${{ env.IMAGE_NAME_AIOPS }}:${{ github.sha }}

  package-deployment:
    name: Generate Deployment Artifacts
    needs: [build-and-push-docker]
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Zip Deployment Files
        run: zip -r deployment-package.zip docker-compose.yml k8s/ monitoring/ logging/

      - name: Upload Artifact
        uses: actions/upload-artifact@v3
        with:
          name: deployment-package
          path: deployment-package.zip
