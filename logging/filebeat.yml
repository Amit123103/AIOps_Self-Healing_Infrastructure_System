# === FILE: logging/filebeat.yml ===
filebeat.inputs:
- type: container
  paths:
    - '/var/lib/docker/containers/*/*.log'
  # Only collect logs from the microservice container
  processors:
    - add_docker_metadata:
        host: "unix:///var/run/docker.sock"
    - drop_event:
        when:
          not:
            equals:
              container.labels.com_docker_compose_service: "microservice"

output.logstash:
  hosts: ["logstash:5044"]

logging.level: info
