# === FILE: logging/logstash.conf ===
input {
  beats {
    port => 5044
  }
}

filter {
  # The microservice logs are captured by docker's json-file driver.
  # The actual log text is in the "message" field inside the beat structure.
  
  # Parse out the string if it contains standard log formats, or just tag it
  mutate {
    add_field => { "pipeline" => "aiops" }
    add_field => { "service" => "microservice" }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "aiops-logs-%{+YYYY.MM.dd}"
    template_name => "aiops_logs"
    manage_template => false # We manage it separately or let ES handle
  }
  # stdout { codec => rubydebug } # Uncomment for debugging
}
